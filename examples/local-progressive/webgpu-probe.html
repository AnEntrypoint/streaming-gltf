<!doctype html><html><head><meta charset="utf-8"><title>webgpu probe</title>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js"
  }
}
</script></head>
<body><canvas id="c" width="64" height="64"></canvas>
<script type="module">
// Feasibility probe: can a WebGPURenderer (three/webgpu build) render a scene
// built with the STANDARD three module's Mesh/Material/BatchedMesh? Reports a
// JSON verdict on window.__probe.
const out = { gpu: !!navigator.gpu };
try {
  const THREE = await import('three');                 // WebGL build namespace
  const WGPU = await import('three/webgpu');            // WebGPU build namespace
  out.hasWebGPURenderer = typeof WGPU.WebGPURenderer === 'function';
  out.sameMeshClass = THREE.Mesh === WGPU.Mesh;         // are the class identities shared?
  const canvas = document.getElementById('c');
  const renderer = new WGPU.WebGPURenderer({ canvas, antialias: false });
  await renderer.init();
  out.initOK = true;
  out.backend = renderer.backend && renderer.backend.isWebGPUBackend ? 'webgpu' : (renderer.backend ? 'webgl-fallback' : 'unknown');
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(55, 1, 0.1, 100); cam.position.z = 5;
  // (a) standard Mesh + MeshBasicMaterial from the WebGL-build namespace
  const m = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshBasicMaterial({ color: 0xff8800 }));
  scene.add(m);
  // (b) a BatchedMesh from the WebGL-build namespace with one instance
  let batchedOK = true, batchedErr = '';
  try {
    const bm = new THREE.BatchedMesh(4, 1024, 2048, new THREE.MeshBasicMaterial());
    const gid = bm.addGeometry(new THREE.BoxGeometry(1,1,1));
    const iid = bm.addInstance(gid);
    bm.setMatrixAt(iid, new THREE.Matrix4().makeTranslation(2,0,0));
    scene.add(bm);
  } catch(e){ batchedOK=false; batchedErr=String(e.message||e); }
  out.batchedAdded = batchedOK; out.batchedErr = batchedErr;
  renderer.render(scene, cam);
  out.renderStandardMeshOK = true;
} catch (e) {
  out.error = String(e && e.stack || e);
}
window.__probe = out;
console.log('WEBGPU_PROBE ' + JSON.stringify(out));
</script>
</body></html>
