  - document the intended contract (asset cache is url-keyed and persists across dispose, entity-level state is what must be freed) if working as designed, else fix
  status: completed
  witness: 'Read spawn()/dispose()/_resolveAsset() closely: Asset objects are cached in pool._assets keyed by url and are INTENTIONALLY shared/persistent across entity dispose cycles (this is the documented multi-entity-sharing design, not a leak) -- an entity disposed before its asset resolves correctly short-circuits via placeholder._disposed in the .then() callback and never allocates trackedMeshes/instanced slots (those are only created in _bootstrap after the disposed-check, which returns early). No entity-level leak found: the early-return in _bootstrap (this._disposed check right after `await this.asset.ready`) prevents any GPU resource allocation for a cancelled bootstrap. Documented as working-as-designed; no code change needed.'
