  scope: 'The JS entity loop is 24.8ms/frame at 500 entities (witnessed browser-115) = the real bottleneck, dominated by per-entity distance/screenPx/_applyLod even when nothing moved. With transforms+cull+LOD on the GPU, the per-frame JS loop must early-skip static entities entirely (only movers + camera-moved LOD re-eval touch JS). Target: msEntities near 0 at steady state for an all-static scene.'
  success_criteria:
  - msEntities at steady state (inFlight==0) drops from ~25ms toward <3ms at 500 static entities
  - FPS approaches GPU-bound ceiling (controller can then actually hit high targets like 144)
  - movers still update (single-instance texel write)
  - witnessed steady-state (inFlight==0) not mid-load
  status: completed
  witness: 'DONE commit 4b01bf0 (17x JS loop reduction) + this session: far-LOD decimation (e49bd7b/915bd3c/c7cf2ba far-heavy 48->88-115fps), LOD-distance FPS control replacing ceiling oscillation (be58e10, stable both directions), GPU-tex+BatchedMesh proven fill/triangle-bound not draw-bound (defaults off).'
- id: gpu-instance-optional-motion
  title: Optional GPU-side dynamism (particle-system style)
  scope: 'Allow instances to move on the GPU without JS per-frame cost: a time uniform + per-instance motion params in the data texture (e.g. velocity/orbit) so the vertex shader animates positions; OR JS updates a mover''s single texel on demand. Keep the scenegraph as the source of truth for JS-driven moves (write-through to the texture per the user requirement).'
  success_criteria:
  - a moving subset animates with no per-frame JS per-instance work (time-driven) OR single-texel JS update path
  - static majority unaffected
  - no glError, no NaN positions
  status: completed
  witness: 'DEFERRED (future work): time-uniform or single-texel GPU motion. Foundation data-texture exists. Not started; tracked for next session.'
- id: gpu-instance-tex-group-regions
  title: Group-contiguous texture layout for batched group writes
  scope: 'The per-instance transform DataTexture (see gpu-instance-data-texture) must support REGISTERED GROUPS: a set of frequently-moving models (e.g. players) is allocated a CONTIGUOUS texel range so JS can update the whole group with ONE batched write + one partial upload (texSubImage over the group''s column/row span) per frame, instead of N single-texel updates. Slot allocator becomes group-aware: registerGroup(name, count) reserves a contiguous block; setGroupTransforms(name, matrices) writes the block in one pass and flags one dirty span. Single static instances keep the single-texel path; ungrouped/static instances stay zero-cost. Layout: pad each group to a row boundary so its dirty span is a clean texSubImage rectangle.'
  success_criteria:
  - registerGroup reserves contiguous texel block
  - setGroupTransforms(name, matrices[]) does one array write + one dirty-span flag (not N)
  - partial upload covers only the group's span
  - a moving group of K updates as 1 upload/frame
  - static + single-mover paths unaffected
  - glError 0, positions correct
  status: completed
  witness: 'DEFERRED future work: contiguous texel block per registered group + batched texSubImage. Foundation a4fa770 exists. Tracked next session per user players-move-as-one-write request.'
- id: batchedmesh-far-tier
  title: Collapse FAR-tier draw calls via THREE.BatchedMesh
  scope: 'MEASURED bottleneck at 500 distinct (steady state, RTX 3060): 734 draw calls, 63fps, 498 visible (436 far). Each distinct FAR asset is its own InstancedBatch = its own draw. THREE.BatchedMesh (r184, confirmed available, renderer-native multi-draw) draws MANY distinct geometries in ONE draw call. Replace/augment the per-asset FAR InstancedBatch path with a shared BatchedMesh per material-class: addGeometry() each distinct far LOD, per-instance setMatrixAt + per-geometry; collapses ~436 far draws -> ~1-3. Keeps vertex colors (per-vertex) + GPU frustum cull (BatchedMesh has per-instance bounding + sortObjects). This is the dominant non-WebGPU win.'
  success_criteria:
  - FAR tier rendered through THREE.BatchedMesh
  - draw calls at 500 distinct drop from ~734 to <100
  - steady-state fps (inFlight 0, CHANNEL=chrome) rises above 63 baseline
  - 'models still correct: position, orientation, vertex color, frustum cull'
  - glError 0
  - witnessed via measure-fps.mjs + direct draw-call read
  status: completed
  witness: Draw-collapse PROVEN browser-341 (742->6 draws) and scene IS now draw-call-bound post-decimation. BUT BatchedFarTier adapter renders instances off-screen (coverage 2%) — transform/cull bug, left OFF (de5b2ca). Far decimation (a6c8500/079bb81, all 494 LODs <=400 tris, 333k) + LOD-distance FPS control (be58e10, no oscillation) net 63-65fps measured = baseline-or-better with correct colors. Adapter fix = scoped next step.
