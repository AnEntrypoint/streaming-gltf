    title: Implement deferred queue timeout/backpressure
    description: 'Current: DeferredLoadQueue at line 1309 with maxConcurrentDefers=2. Problem: 297-item buildup during 1000-entity spawn. Fix: Add abort timeout (5s per request), drop stale requests if queue size > threshold (50 items), emit warning to console.'
    scope: model-pool.js lines 1309+, DeferredLoadQueue constructor + _runTask
  - id: entity-loop-optimize
    title: Further optimize Entity._update() if CPU-bound
    description: 'Current: 2.7ms for 720 entities (0.00375ms per entity). If GPU profiling shows GPU-bound, defer this; if CPU-bound, explore: (A) spatial partitioning to cull entity loop before frustum test, (B) move frustum computation to GPU compute shader, (C) reduce iteration frequency for static entities.'
    scope: model-pool.js lines 928-1047 Entity._update()
  - id: measure-real-fps
    title: Measure actual FPS with all fixes applied
    description: 'Run browser automation (diagnose-performance.mjs) after fixes. Capture: baseline FPS, FPS after +1000 spawn, visible entity count, frame-time breakdown, memory usage. Compare against 60 FPS target.'
    scope: diagnose-performance.mjs + stress.html
