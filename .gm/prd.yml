- id: plod-codec-module
  text: 'HARDEST/PROVING NODE. Implement standalone codec module (no three, no browser): buildPlod({positions:Float32Array, colors?:Uint8Array, index:Uint32Array}, {levels|ratios, errors}) -> ArrayBuffer. Per level: meshopt_simplify the index to a target tri count, optimize vertex cache+fetch, compact to only referenced verts, serialize self-contained level; concatenate coarse->fine; write header. readPlod(buffer) -> {header, levels:[...] } and readPlodLevel(buffer, k) -> {positions,colors,index}. Pure data-in/data-out so it is node-testable end to end.'
  deps:
