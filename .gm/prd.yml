  scope: 'User: everything GPU-resident once loaded, LOD switching should be ~free, but LOD changes clearly stutter. Find the per-switch main-thread cost in _applyLod / _getInstancedSlot / BatchedFarTier acquire path: new Mesh/SkinnedMesh allocation, material clone, BatchedMesh.addGeometry (re-upload of shared buffer = GPU stall), addInstance/setGeometryIdAt, geometry normalization, async ensureMeshLod re-fetch, _clusterDecimate at switch time. Measure which one spikes the frame on a switch (instrument frame time across a forced LOD transition).'
  success_criteria:
