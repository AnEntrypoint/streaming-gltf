- id: feasibility-verdict
  text: 'Feasibility: can the highest-LOD polys be voxel/spatial-index arranged so a prefix of one fixed buffer == a usable LOD? Grounded verdict with the critical correction: a NAIVE Morton/voxel sort of triangles makes a buffer PREFIX a spatial PATCH (one corner of the model), NOT a coarse whole-model approximation -> the user''s literal ''truncate the buffer for LOD'' does not work as-is. A prefix==LOD requires a refinement hierarchy, not just a spatial sort.'
  status: completed
  witness: '_clusterDecimate (lod-worker.js:155, model-pool.js:713) groups verts by res^3 grid cell; a prefix of triangles in any spatial/Morton order is therefore a spatial subset (patch), not a coarse whole. prefix==LOD needs a refinement hierarchy, not a sort. Verdict: literal idea infeasible; hierarchical variant feasible.'
- id: working-technique-id
  text: 'Identify techniques that DO give prefix==LOD in one streamable buffer under WebGL2 (no compute/mesh shaders): (a) Hoppe progressive-mesh / vertex-split stream (base mesh + edge-collapse-reverse ops; CPU refine per frame); (b) meshlet cluster-DAG aka Nanite-lite (spatial clusters + simplified parent groups, CPU error-select per view); (c) octree/voxel cell stream Potree-style (prefix of cells == coarse whole; renders as points/voxels, fidelity change). Map each to this engine''s far/near tiers.'
  deps:
  - feasibility-verdict
  status: completed
  witness: 'Three known prefix==LOD schemes enumerated and mapped to WebGL2 (no compute/mesh shaders): progressive-mesh vertex-split (CPU refine), meshlet cluster-DAG/Nanite-lite (CPU error-select), octree/voxel-cell stream (points/voxels). Recorded in memory mem-1781712926965.'
- id: codebase-fit-map
  text: 'Map proposal onto current architecture. REPLACES: EP_progressive_lod N discrete sibling-GLB files per asset, _pickMeshLod discrete threshold ladder + hysteresis, per-LOD ensureMeshLod/_lodWarmQueue fetch+decode, load-time _clusterDecimate re-decimation. ADDS: per-frame cluster/cell selection cost (CPU) which the engine deliberately moved OFF the per-frame path (GPU instance tex, GPU lerp, one-shot load decimation). Net code delta must be measured, not assumed.'
  deps:
  - working-technique-id
  status: completed
  witness: 'REPLACES: EP_progressive_lod sibling-GLB descriptors (model-pool.js Asset._load ~480-520), _pickMeshLod ladder (model-pool.js:1784), ensureMeshLod/_lodWarmQueue fetch, load-time _clusterDecimate. ADDS: per-frame CPU cluster/cell selection -- contrary to the engine''s GPU-instance-tex/GPU-lerp/one-shot-decimation direction. Net delta unknown until prototyped.'
- id: perf-constraint-caveat
  text: 'Honest caveat (witnessed): at 500-1000 distinct models this workload is TRIANGLE/FILL-bound, NOT draw-call or download-size bound (recall: BatchedMesh draw collapse gave 0 fps gain; renderer is geometry/vertex/fill limited). Therefore continuous poly-streaming sells ONLY on the user''s stated goals -- smaller download/disk, simpler streaming, less code -- and must NOT be pitched as an FPS lever. Same on-screen triangles = same FPS.'
  deps:
  - feasibility-verdict
  status: completed
  witness: 'recall mem-1779833913815 (gltf-progressive): BatchedMesh far tier collapsed 437 far draws to ~1 with IDENTICAL 63fps -> draw-call/size not binding; triangle/fill is. So this is a size/streaming/code win, never an FPS lever.'
- id: existing-overlap
  text: 'Note: the user''s instinct is PARTIALLY already shipped. _clusterDecimate (lod-worker.js + model-pool.js) already voxel-grids the bbox into res^3 cells and collapses each cell to one representative vertex -- i.e. spatial-index vertex clustering. It runs per-discrete-LOD at LOAD time, descending res 48->2 to the finest grid under a tri cap. A continuous scheme would lift this SAME clustering to bake time and order it coarse->fine into one buffer instead of recomputing per LOD per load.'
  deps:
  - codebase-fit-map
  status: completed
  witness: _clusterDecimate descends res 48->2, grid key (gx*res+gy)*res+gz, one rep vertex per cell (model-pool.js:713-784). This IS spatial-index vertex clustering, run per-discrete-LOD at load. Continuous scheme lifts it to bake time, ordered coarse->fine in one buffer.
- id: recommended-approach
  text: 'Recommend the variant that NETS A SMALLER maintained surface (architecture-pliable rule: only replace if smaller). Candidate: bake-time, per asset, ONE shared vertex buffer + a coarse->fine ordered index/cluster stream (meshopt_simplify is already a dep) carrying a small {byteOffset -> screen-error} table; runtime reads up to offset f(screenPx) into a fixed BatchedMesh geometry slot -- no sibling files, no _pickMeshLod ladder, no re-decimation. Full Nanite cluster-DAG is MORE code (rejected unless near-LOD continuity is required). Octree-voxel only for the far/impostor tier where fidelity loss is already accepted.'
  deps:
  - working-technique-id
  - existing-overlap
  - perf-constraint-caveat
  status: completed
  witness: 'package.json:44,48-52 -> meshoptimizer ^1.1.1 + @gltf-transform/* ^4.3.0 already deps. Recommended smallest-surface variant: bake-time one shared vertex buffer + coarse->fine ordered index stream + {byteOffset->screenError} table; runtime truncates at f(screenPx) into a fixed BatchedMesh slot. Cluster-DAG rejected (net code growth) unless continuous near-LOD required.'
- id: memory-capture
  text: 'memorize-fire the durable architectural assessment so future sessions don''t re-derive it: (1) naive spatial-sort-truncate fails (prefix=patch not coarse-whole); (2) prefix==LOD needs a refinement hierarchy (progressive-mesh / cluster-DAG / octree); (3) workload is triangle-bound so this is a size/streaming/code win not an FPS win; (4) _clusterDecimate already does the spatial clustering at load; (5) meshoptimizer+@gltf-transform already deps.'
  deps:
  - recommended-approach
  status: completed
  witness: memorize-fire stored key mem-1781712926965-0-1864 (embedded:true, graph_edge:true) carrying the full assessment.
- id: user-direction-decision
  text: 'RESOLVED DIRECTION (user, 2026-06-17): build option A refined for PROGRESSIVE DOWNLOAD AVAILABILITY -- ''fill the data of each lod when we download it, to make it available at that point.'' Chosen format: ONE buffer per asset = header level-table + concatenated SELF-CONTAINED levels coarsest->finest (each level carries its own verts+colors+index). As each level''s bytes finish arriving it is immediately renderable; next level upgrades in place. Build OPT-IN/default-off first (project pattern), witness, then retire the discrete ladder. Not an FPS change (triangle-bound); a size/streaming/code win.'
  status: completed
  witness: 'User answer 2026-06-17: ''we want to fill the data of each lod when we download it, to make it available at that point.'' -> option A refined to concatenated self-contained coarse->fine levels (.plod), progressive-download-renderable. Implementation cover laid: plod-format-spec..plod-migration.'
- id: plod-format-spec
  text: 'Define the .plod progressive format (data model first). Little-endian header: magic ''PLOD'', u16 version, u8 attrFlags (bit0 color, bit1 normal), u8 levelCount, then per-level record {u32 byteOffset, u32 byteLength, u32 vertCount, u32 triCount, f32 screenErrorPx}. Body = levels concatenated coarsest->finest, each level self-contained: [positions f32*3*vert][colors u8*4*vert if flag][index u32*3*tri]. INVARIANT: any prefix that ends exactly at a level boundary is a complete renderable mesh. Header is at file front so a streaming reader knows level boundaries from the first bytes.'
  deps:
  - user-direction-decision
  status: completed
  witness: 'Implemented in examples/local-progressive/plod-codec.js (header ''PLOD''|u16 ver|u8 flags|u8 levelCount + 24B records). Node test exec_js-46: offsetsContiguous=true, tableMatchesBuf=true, all level byteOffset+byteLength tile the buffer exactly.'
