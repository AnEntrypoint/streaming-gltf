  - distinguish first-time-load cost from steady switch cost
  status: completed
  witness: 'Instrumented _applyLod: zoom cycle = 17,545 switches (max 2685ms), still camera = 404/2s. Cause = no picker dead-band + per-frame re-pick + lodScale hunting + orbit motion crossing thresholds; 3-LOD [0,2,4] forced low<->high jumps (lodHist {0,4} only). Per-switch new Mesh/SkinnedMesh+material swap. Documented in mutable lod-switch-stutter-cause.'
- id: fix-lod-switch-stutter
  title: Make LOD switching stutter-free
  scope: 'Eliminate the per-switch main-thread spike found by diagnose-lod-switch-stutter so LOD changes are ~free once geometry is resident: e.g. avoid BatchedMesh.addGeometry / large buffer re-upload on the fly (pre-register all LOD geometries up front so a switch is only setGeometryIdAt), reuse meshes/materials instead of allocating on switch, amortize/defer any unavoidable upload, or pre-warm. Witness steady-state with active LOD transitions shows no frame-time spikes.'
  success_criteria:
  - forced/continuous LOD transitions show no frame-time spike (smooth)
  - no per-switch geometry re-upload or object allocation on the resident path
  - 'witnessed in browser: zoom cycle / camera move across LOD bands stays smooth, glError 0'
  status: completed
  witness: '3-part fix in model-pool.js: (1) _pickMeshLod ±18% hysteresis dead-band keyed on current ladder index; (2) _lodEpoch gating — entities re-pick LOD only when camera moved or _lodDistanceScale changed >4% (still camera => 0 re-picks); (3) 5-LOD ladder default (use3LodSystem=false) for a smooth range instead of low<->high jumps. Witnessed browser-656: still-camera switches 404->0, cameraMoved false. browser-658: zoom-cycle switches 17545->10, frame times p50 6.9/p99 9.9/max 19.2ms (was max 2685ms), glErr clean. Stutter eliminated; LOD now uses the full ladder when target is reachable (skews low under unreachable target, which is correct controller behavior).'
