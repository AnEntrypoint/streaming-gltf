  - id: gpu-profile
    title: Profile GPU rendering path
    description: 'Measure per-frame: fragment shader time (WebGL timer queries or WebGPU if accessible), vertex shader time, draw call overhead, triangle throughput. Compare against CPU entity update time (2.7ms baseline).'
