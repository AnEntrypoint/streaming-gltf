- id: gpu-lod-swap-design
  title: Design GPU-side LOD swap (no per-switch JS object/material swap)
  scope: 'User intent: do LOD swaps on the GPU. Today a vertcolor<->textured switch allocates a new THREE.Mesh/SkinnedMesh, swaps material (program change), and add/removes from the scene graph — per-switch CPU cost. GPU end-state: a LOD change is a per-instance selection (visibility flag / geometryId) on a GPU-resident structure, no JS allocation, no program swap, no scene mutation. Decide the reachable mechanism through THREE: (a) keep ALL of an entity''s renderable representations resident and toggle per-instance visibility on GPU (BatchedMesh per LOD with setVisibleAt, or one BatchedMesh holding all LODs and setGeometryIdAt), (b) bucket entities into per-LOD BatchedMeshes and move an instance between buckets via visibility (no alloc), vs (c) reduce the textured tier to also be instanced so it never needs a per-entity Mesh. Note: true geometry-swap multi-draw is unreachable via renderer.render(); the reachable form is per-instance visibility/geometryId.'
  success_criteria:
  - chosen mechanism is reachable through THREE renderer (no per-switch JS alloc / program swap / scene mutation)
  - plan covers vertcolor<->textured AND textured-LOD<->textured-LOD switches
  - witness budget + correctness (textures, colors, skinning) considered
  status: completed
  witness: 'SUPERSEDED by evidence: the per-switch cost is NOT the JS Mesh/material/scene swap (that''s ~0.6ms/frame, measured free for resident geo, browser-714) — it''s that LODs aren''t resident (lazy-loaded on first pick, 11k cache misses at 1000, browser-721/723). A GPU-swap rebuild would not help a cold-cache load. Correct fix = preload all LODs (prd preload-all-lods). GPU-swap design deferred as unnecessary for this symptom.'
- id: implement-gpu-lod-swap
  title: Implement GPU-side LOD swap so switches are ~free
  scope: 'Per the chosen design (gpu-lod-swap-design): make a LOD change a GPU-resident per-instance operation with NO per-switch JS Mesh/material/scene-graph work. Reuse mesh objects (no new THREE.Mesh/SkinnedMesh on switch), avoid material program swaps (share program / pre-warm), avoid scene add/remove. Witness per-switch _applyLod (or its replacement) time ~0 and a continuous zoom across all bands stays smooth at 500-1000 models, glErr 0, correct render.'
  success_criteria:
  - per-switch main-thread time near zero (no alloc/program-swap/scene-mutation on resident path)
  - 'continuous LOD transitions at 500-1000 models: no frame-time spikes, models correct, glErr 0'
  - committed + pushed to AnEntrypoint/streaming-gltf master
  status: completed
  witness: 'SUPERSEDED: measured per-switch JS swap cost is ~free for resident geometry (+0.6ms/frame, browser-714). The visible cost is cache-miss loading (prd preload-all-lods), not the swap mechanism. Implementing a GPU-swap would not address a cold-cache load. Redirected to preload-all-lods + cache-miss re-fire guard.'
- id: preload-all-lods
  title: Preload all LOD geometries so switches hit warm cache (no per-switch load)
  scope: 'ROOT CAUSE of per-switch cost at 500-1000 (browser-721/723): only 1725/5868 LOD geometries are cached — LODs load LAZILY on first pick. inFlight=0 means CURRENT picks are loaded, but a camera move picks never-loaded LODs -> 11,242/11,310 switches are cache MISSES -> async ensureMeshLod per switch -> stutter (p50 66ms at 1000). NOT eviction (unloadedCount 0, totalMB 181<256). Fix: after spawn/stream settles, background-preload (low priority, throttled, off-main-thread via the lod-worker) every LOD geometry for resident assets so geoCache is warm; then a switch is a cached geomOnly swap (~0.6ms, measured free). Respect byteBudget/VRAM; preload nearest-first; don''t block interaction. Also guard cache-miss switches from perpetual re-fire (currentLod never advances on miss -> re-picks every epoch).'
  success_criteria:
  - after a warmup window, geoCache holds all (or budget-capped) LOD geos for resident assets
  - a dolly across all bands at 1000 models shows cacheMisses ~0 and no frame spike
  - switch frames ~= non-switch frames
  - glErr 0; committed+pushed
  status: completed
  witness: 'Superseded-and-implemented as the network-lazy/GPU-eager/frame-budgeted warm loader (NOT eager full preload, per user ''lazy from internet''). Wanted-but-unresident LODs warm piecemeal with headroom; switches then hit warm cache. Witnessed browser-744: at 1000 models, extreme churn = 271 switches / 3 misses (was 11310/11242), smooth p50 6.2ms. Implemented via _lodWarmQueue/_drainLodWarm/_gpuWarmGeometry + _lodWantIdx re-fire guard (model-pool.js).'
- id: gpu-eager-net-lazy
  title: 'LOD geometry: lazy from network, EAGER to GPU'
  scope: 'Refines preload-all-lods per user: do NOT eagerly fetch all LOD files from the network (keep progressive streaming lazy). BUT once a LOD''s bytes are fetched+decoded, EAGERLY realize and UPLOAD its geometry to the GPU (warm the buffer) so the actual LOD switch never pays a first-use GPU upload stall on the frame it happens. Mechanism options: (a) after ensureMeshLod resolves a geometry, force a one-time GPU upload (renderer.initTexture-equivalent for geometry: render it once offscreen, or renderer.compile / WebGLRenderer attributes upload) so tm.mesh.geometry=geo later is stall-free; (b) once decoded, keep it GPU-resident (don''t let it drop). Also: a switch to an already-decoded LOD must be a synchronous warm swap (no re-fetch); ensure currentLod advances so the picker doesn''t re-fire on cache miss (the 11k re-fire). Net: network fetch may lag (acceptable), but the SWITCH itself is GPU-warm and free.'
  success_criteria:
  - decoded LOD geometry is GPU-uploaded ahead of the switch frame (no first-use upload stall)
  - switching to a decoded LOD is synchronous + warm (no re-fetch, no re-upload)
  - cache-miss switch advances state so it doesn't re-fire every epoch
  - 'dolly at 1000 with assets resident: switch frames ~= non-switch frames, no spike'
  - glErr 0; committed+pushed
  status: completed
  witness: _gpuWarmGeometry uploads a decoded LOD's buffers to the GPU once (render into a 1x1 offscreen target) so the later switch pays no first-use upload; called from _drainLodWarm after ensureMeshLod resolves. Network stays lazy (fetch on demand via warm queue), GPU upload is eager once decoded. _applyLod miss path no longer awaits except when dropping to a CHEAPER LOD or when no renderable geo exists (avoids stranding entities at an expensive LOD = the fps:1 all-lod2 deadlock; fixed -> fps 124). Witnessed browser-740 hist {lod0:963,lod1:51,lod2:9} spread, fps 124, glErr 0.
- id: amortized-frame-budget-loader
  title: Frame-budgeted piecemeal LOD load/upload (use headroom, no jank)
  scope: 'Per user: spread LOD load work across frames when framerate has headroom, piecemeal, so it never janks. Build a per-frame budget pass in pool.update(): process at most N items OR until ~Xms used per frame, AND only when FPS is comfortably above target (headroom) — back off when FPS is low so loading never causes the stutter it''s meant to prevent. Queue = LODs the picker WANTS but aren''t resident, nearest/most-needed first. Each item: fetch (network-lazy, off-main-thread worker), decode, then GPU-WARM (eager upload) so the eventual switch is free. Combine with: (1) gpu-eager-net-lazy (upload decoded geo ahead of switch); (2) cache-miss re-fire guard (a switch whose geo isn''t resident must mark the entity ''requested'' and NOT re-invoke _applyLod / re-pick every epoch until the geo arrives — that was the 11,242 misses/11,310 switches churn). Net: smooth pan/zoom at 1000 models, LODs sharpen in piecemeal as headroom allows, zero switch-frame spikes.'
  success_criteria:
  - per-frame load/upload budget honored; backs off when FPS below target
  - cache-miss switch does not re-fire every frame (requested-marker guard)
  - 'dolly at 1000: no frame spikes, LODs progressively resolve, cacheMisses-per-frame bounded'
  - glErr 0; committed+pushed to master
  status: completed
  witness: 'Implemented _lodWarmQueue + _drainLodWarm (model-pool.js): cache-miss LOD switch enqueues a want instead of awaiting; _drainLodWarm processes piecemeal each frame with an ADAPTIVE budget (2x starts above target+5, 1x near target, min 1 below — never 0, which deadlocked at fps 1). _enqueueLodWarm dedups nearest-first. cache-miss re-fire guard via tm._lodWantIdx (picker skips re-invoking _applyLod for an already-requested unresident target). Witnessed browser-744 (1000 models, extreme near<->far churn): switches 11310->271, cacheMisses 11242->3, maxSwitchesInAFrame 130->8, p50 6.2ms, noSwAvg 7.3 vs switchFrameAvg 9.8ms; one 74.8ms spike only on an abrupt teleport-cut. glErr 0. fps recovered 1->124-154.'
