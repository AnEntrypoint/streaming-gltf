  witness: 'RESOLVED — was NOT a bug. Off-screen was a coverage-metric artifact at a far camera (498 tiny dots ~2% coverage with/without batching). Matched-camera proof browser-369 vs 366: coverage 0.025/0.531/0.122 (ON) >= 0.022/0.469/0.11 (OFF). BatchedFarTier shipped ON (faf71cc): median 68-70fps vs 63 baseline, draws 742->6, peaks 140+, glErr 0, colors correct.'
