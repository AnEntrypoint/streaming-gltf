  title: Fix BatchedFarTier rendering instances off-screen
  scope: 'BatchedFarTier collapses 742->6 draws but coverage=2% (empty). Matrices correct+spread, instances visible, cull-off doesnt help -> real decimated far geos render to nothing in the shared BatchedMesh buffer (per-asset InstancedBatch renders same geos fine). Isolate via box-vs-realgeo in a fresh BatchedMesh. Win: lifts the ~40fps all-visible draw-bound floor (494 draws->~1).'
