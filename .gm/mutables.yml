- id: batched-gpu-lerp-design
  status: resolved
  question: How to do true in-shader GPU position lerp on the BatchedMesh far tier (r0.170)?
  witness_evidence: 'claude-code-guide r0.170 research + batched-far-tier.js read. BatchedMesh r0.170: vertex shader gets instance id via getIndirectIndex(gl_DrawID) (defined by <batching_pars_vertex>); <batching_vertex> computes ''mat4 batchingMatrix = getBatchingMatrix(getIndirectIndex(gl_DrawID))'' but does NOT yet apply it to ''transformed'' (project_vertex applies modelViewMatrix*batchingMatrix). No per-instance attributes possible (shared geo/material) -> use a parallel DataTexture indexed by getIndirectIndex(gl_DrawID) via texelFetch. DESIGN: parallel RGBA32F texture, 2 texels/instance: texel0=pos0.xyz+startTime(.w), texel1=pos1.xyz+dur(.w), indexed by instanceId (square texture, texelFetch ivec2(id2%w,id2/w)). Add uniform uNow (sec, 1 write/frame). In BatchedFarTier.material.onBeforeCompile, after <batching_vertex>: read instanceId=getIndirectIndex(gl_DrawID), fetch pos0/pos1/timing, t=dur>0?clamp((uNow-startT)/dur,0,1):-1; if t>=0 OVERRIDE batchingMatrix translation column: batchingMatrix[3].xyz = mix(pos0,pos1,t) (keeps rotation/scale from setMatrixAt, lerps only translation); if t<0 (no active lerp) leave batchingMatrix as-is (static). Then inject so project_vertex uses the modified batchingMatrix — replace <project_vertex> with custom that does mvPosition=modelViewMatrix*batchingMatrix*vec4(transformed,1). CPU writes pos0/pos1/timing texels only on setTarget (sparse) + uNow once/frame; in-flight entities cost ZERO per-frame matrix writes. setMatrixForSlot still writes the batchingMatrix (rotation/scale/base pos) at acquire/LOD-change. Need NearestFilter no-mipmap float texture (texelFetch ignores filtering anyway).'
