  witness_evidence: 'stress.js:60 useBatchedFarTier:true and stress.js:66 ''if(!pool._useBatchedFarTier) enableDrawCallBatching(pool)'' -> the InstancedBatch/draw-call-batching.js path is INACTIVE by default. The dominant visible tier (892/956 entities = FAR) goes through BatchedFarTier (batched-far-tier.js): setMatrix -> BatchedMesh.setMatrixAt -> three''s INTERNAL _matricesTexture (three owns the matrix-fetch shader chunk, no public per-instance attribute hook). So GPU-instance-texture lerp (InstancedSlot path) barely touches visible entities at scale. CONSEQUENCE: for this config, the feasible+correct position-update path is CPU-lerp of ONLY the active-mover set in the far tier (O(movers)/frame via setMatrixAt, three uploads its own dirty range) — this satisfies ''O(updated) CPU cost'' since idle far entities cost nothing. Full GPU-texture lerp still built for the InstancedSlot/mid tier (smaller here, future-proof, and the WebGPU storage-buffer mirror). The BatchedMesh GPU-shader lerp (patching three''s batching_vertex) is the documented invasive stretch, deferred.'
