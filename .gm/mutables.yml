  witness: 'git_finalize/git_push both report: ''push rejected (remote moved); pull --rebase origin master conflicted and was aborted... CONFLICT (content): Merge conflict in package.json''. Root cause isolated: my commit and origin''s commit both change package.json''s version line 2.0.8->2.0.9 (identical resulting text, since I manually matched origin''s bump before committing) -- git''s rebase does a line-based 3-way diff per replayed commit and flags this as a real conflict even though final content is byte-identical, because both sides independently touched the same line versus the d8ad2ea merge-base. No git_rebase/git_merge/conflict-resolve verb exists in the spool (only git_status/git_log/git_diff/git_show/git_branch inspect; git_add/git_commit/git_finalize/git_push stage-commit-push; git_checkout/git_fetch/git_rm/git_revert/git_reset mutate) -- none of these let me interactively continue a stuck rebase or choose ''ours''/''theirs'' on a specific conflicted file. git_finalize''s internal rebase auto-aborts cleanly on conflict (verified: git_status shows clean tree immediately after), so no destructive state, just push blocked.'
  witness_evidence: 'Root cause confirmed via git merge-file -p direct 3-way test: adjacent-line edits (my line 4, origin''s line 3, no blank-line separator between them) get grouped into ONE diff hunk by git''s line-based algorithm even when the final resulting text has zero semantic overlap -- this is git''s real hunk-collision behavior, not a plugkit tooling bug. Resolved by git_reset --soft to origin/master (making HEAD == origin/master, zero rebase distance) before each commit that touches this file, so the commit applies with no replay/hunk-diff needed at all. Landed via two commits: b91ce65 (occlusion-culling feature, package.json untouched to avoid the collision) then 2a15ef7 (description-only fix, committed directly on the then-current origin tip). Both pushed successfully via git_finalize.'
