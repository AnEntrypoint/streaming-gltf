- id: lod-switch-stutter-cause
  status: witnessed
  question: Which operation on a LOD switch spikes the main-thread frame time?
  witness_evidence: 'Instrumented _applyLod (browser-639): a 6-step zoom cycle fired 17,545 switches (avg 53-92ms incl async loads, max 2685ms); still camera fired 404 switches/2s (browser-644) = perpetual re-fire. ROOT CAUSE: per-entity LOD picker (_pickMeshLod) ran every frame for every visible entity with NO dead-band, and the FPS-controller''s _lodDistanceScale hunting + orbit camera continuously crossed thresholds -> flip every frame; the 3-LOD [0,2,4] mapping made it jump straight LOD0<->LOD4 (lodHist {0:171,4:328}, no middle). Each switch also allocated a new THREE.Mesh/SkinnedMesh + swapped material (shader program change) on vertcolor<->textured. FIX (3 parts): (1) picker hysteresis ±18% dead-band keyed on current ladder index; (2) per-pool _lodEpoch bumped only on camera-move or scale-change>4% — entities re-pick only when epoch changes, so still camera = 0 re-picks; (3) default to 5-LOD ladder [0,1,2,3,4] not 3-LOD. Witnessed browser-656/658: still camera switches 404->0; zoom-cycle switches 17545->10; frame times p50 6.9ms p99 9.9ms max 19.2ms (was max 2685ms) = stutter gone.'
- id: per-switch-cost-dominant-op
  status: witnessed
  question: Which sub-op dominates the residual per-LOD-switch cost on resident geometry?
  witness_evidence: 'Instrumented _applyLod at steady state (browser-712/714, 500 models, orbit/zoom off, target60). RESIDENT-geometry switch is NEAR-FREE: frames WITH a LOD switch averaged 7.8ms vs 7.2ms without (only +0.6ms), switchFrameMax 12.8ms — no spike (browser-714: 80 switches/108 frames smooth dolly, maxMs 30.2 was a NON-switch frame). The new-Mesh/SkinnedMesh alloc branch NEVER fires (assets unskinned -> always geomOnly path, browser-710 newMesh n:0). Material program swap negligible (programsCompiled:1 total). The big 335ms avg in browser-710 was MID-LOAD streaming contention (assets still decoding), not the swap. So the residual ''cost'' = (a) cacheMiss switches during streaming (~8.8ms, max 33ms) i.e. geometry not yet resident, and (b) first-use GPU buffer upload when tm.mesh.geometry=geo (a render-time GPU stall not captured in JS _applyLod timing). DOMINANT op = geometry residency/upload on first switch, NOT the JS swap. Fix direction: preload+pre-upload all LOD geometries for resident entities so every switch hits a warm cached+uploaded buffer.'
