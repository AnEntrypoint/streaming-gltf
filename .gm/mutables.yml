- id: webgpu-dual-backend-constraint
  status: witnessed
  question: Can WebGL and WebGPU share the same custom-shader render path in three r0.170?
  witness_evidence: 'claude-code-guide survey + threejs r0.170 docs: NO. three/webgpu is a SEPARATE build (build/three.webgpu.min.js). Node materials (TSL) do NOT run on THREE.WebGLRenderer in r0.170. onBeforeCompile GLSL patching does NOT run on WebGPURenderer. Therefore a dual-backend renderer needs renderer-specific shader code: GLSL+onBeforeCompile for WebGLRenderer, TSL node materials for WebGPURenderer. WebGPURenderer has its own WebGL2 fallback backend but our existing GLSL patches won''t execute on it. renderer.info.calls/triangles is unreliable under WebGPURenderer (use timestamp queries or skip). render() is sync after async init(); use await renderer.init() or setAnimationLoop. ARCHITECTURE: keep WebGLRenderer as proven default; add WebGPURenderer as opt-in (?backend=webgpu), feature-detected (navigator.gpu); the shader patches must be authored twice (GLSL + TSL). importmap needs a ''three/webgpu'' + ''three/tsl'' entry pointing at three.webgpu.min.js.'
- id: gpu-lerp-design
  status: witnessed
  question: What is the on-GPU position-lerp data model + shader math + CPU API + per-tier feasibility?
  witness_evidence: 'Plan subagent design: DATA MODEL — extend existing per-instance instance-data texture from 4 texels (mat4) to 6 texels/instance: texel0-3=mat4 (rot/scale + base translation c3), texel4=pos0.xyz+startTime(.w), texel5=pos1.xyz+duration(.w). Lerp TRANSLATION ONLY (keep mat4 for rot/scale). SHADER: add uniform uNow (sec, updated once/frame = the ONLY per-frame CPU->GPU write); t=dur>0?clamp((uNow-startT)/dur,0,1):1; lerped=dur>0?mix(pos0,pos1,t):m[3].xyz; m[3].xyz=lerped. t=1 clamp = free completion, pins at pos1 with zero further writes. CPU API: pool.setTarget(entity,[x,y,z],durMs) recomputes current interpolated pos as new pos0 (continuous retarget), writes texels 4-5 + dirty range; setPositionImmediate for dur=0 static. Non-updated entities = ZERO per-frame cost. PER-TIER: MID/InstancedSlot = FULLY FEASIBLE (primary, instance-tex path already exists, default-off behind _enableGpuInstanceTex); FAR/BatchedMesh = PARTIAL (three owns _matricesTexture; recommend CPU-lerp only the active far set, GPU patch is invasive stretch); HERO = skip (tiny, plain Object3D lerp). Per-entity CPU lerp record (Map entity->{pos1,start,dur}) is source of truth that survives LOD/tier switches (reseed new slot texels). WebGPU mirror: StorageInstancedBufferAttribute + positionNode mix instead of DataTexture+GLSL.'
- id: active-tier-for-lerp
